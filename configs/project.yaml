project_name: cpr-video-poc
artifact_root: ./runs

generation:
  backend: wan_t2v_1_3b
  fallback_backend: mock_t2v
  num_frames: 21
  height: 480
  width: 832
  steps: 30
  guidance_scale: 5.0
  fps: 8
  cpu_offload: true
  torch_dtype: bfloat16
  output_basename: output
  prompt_style: realistic_training

storage:
  save_local: true
  save_preview_gif: true
  sync_to_hf: false
  hf_repo_id: null
  hf_private: true

orchestration:
  poll_interval_seconds: 15
  heartbeat_interval_seconds: 30
  stale_after_seconds: 300

evaluation_prompts:
  - Generate a video with Asian people giving CPR in an office
  - Generate a video with African people giving CPR in an office
  - Generate a CPR training scene in a classroom
  - Generate a CPR training scene with one responder
  - Generate a workplace safety CPR scenario in an office
